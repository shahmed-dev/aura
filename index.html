<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura — Reset Password</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; background: #0f0f12; color: #e8e8ea; }
    .card { text-align: center; max-width: 420px; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    p { color: #a0a0a8; line-height: 1.5; }
    a { color: #7c6cff; text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
    .fallback { margin-top: 1.5rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Resetting your password…</h1>
    <p>If the Aura app doesn't open automatically, tap the button below.</p>
    <a id="openApp" href="#">Open Aura</a>
    <p class="fallback">
      If nothing happens, copy this link and open it in the Aura app:<br />
      <code id="linkText"></code>
    </p>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var userId = params.get('userId');
      var secret = params.get('secret');

      var appUrl = 'aura://reset-password';
      if (userId && secret) {
        appUrl += '?userId=' + encodeURIComponent(userId) +
                  '&secret=' + encodeURIComponent(secret);
      }

      // Update the manual link text.
      document.getElementById('linkText').textContent = appUrl;

      // Update the button.
      var btn = document.getElementById('openApp');
      btn.href = appUrl;

      // Try to open the app automatically.
      window.location.href = appUrl;

      // Fallback: if the app didn't open after 2s, show a message.
      setTimeout(function () {
        document.querySelector('h1').textContent = 'Open the Aura app';
        document.querySelector('p').textContent =
          'Tap the button below to continue resetting your password.';
      }, 2000);
    })();
  </script>
</body>
</html>
